<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isla de Cristal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #120818; font-family: 'Inter', system-ui, sans-serif; color: #fff; }
  canvas { display: block; }
  #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 40%, #3a1650, #0d0512 70%); z-index: 20; transition: opacity 1.2s ease; }
  #loader h1 { font-family: 'Cinzel', serif; font-size: clamp(28px, 5vw, 56px); letter-spacing: .2em; margin-bottom: 28px;
    background: linear-gradient(90deg, #8ff0ff, #ff8fd8, #c7a2ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #bar { width: min(320px, 70vw); height: 3px; background: rgba(255,255,255,.12); border-radius: 3px; overflow: hidden; }
  #bar div { height: 100%; width: 0; background: linear-gradient(90deg, #8ff0ff, #ff8fd8); transition: width .2s; }
  #enter { margin-top: 32px; padding: 12px 34px; border-radius: 30px; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.06);
    color: #fff; font: 500 15px 'Inter'; letter-spacing: .12em; cursor: pointer; opacity: 0; pointer-events: none; transition: all .4s; backdrop-filter: blur(8px); }
  #enter.ready { opacity: 1; pointer-events: auto; }
  #enter:hover { background: rgba(255,255,255,.16); box-shadow: 0 0 30px rgba(255,143,216,.45); }
  #title { position: fixed; top: 6vh; width: 100%; text-align: center; pointer-events: none; opacity: 0; transition: opacity 2.5s ease; z-index: 5; }
  #title h2 { font-family: 'Cinzel', serif; font-weight: 700; font-size: clamp(30px, 5.5vw, 72px); letter-spacing: .18em; text-shadow: 0 0 30px rgba(255,160,220,.6), 0 2px 8px rgba(60,0,60,.6); }
  #title p { margin-top: 8px; font-size: clamp(12px, 1.3vw, 16px); letter-spacing: .25em; opacity: .85; text-transform: uppercase; }
  #hud { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; z-index: 6;
    padding: 10px 14px; border-radius: 40px; background: rgba(20,8,30,.45); border: 1px solid rgba(255,255,255,.14); backdrop-filter: blur(14px);
    opacity: 0; transition: opacity 1.5s; }
  #hud button { padding: 9px 16px; border-radius: 22px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.06); color: #fff;
    font: 500 13px 'Inter'; cursor: pointer; transition: all .25s; white-space: nowrap; }
  #hud button:hover { background: rgba(255,255,255,.18); }
  #hud button.on { background: linear-gradient(135deg, rgba(143,240,255,.35), rgba(255,143,216,.35)); border-color: rgba(255,255,255,.45); }
  #hud label { font-size: 12px; opacity: .8; margin-left: 6px; }
  #hud input[type=range] { width: 110px; accent-color: #ff8fd8; }
  #hint { position: fixed; top: 18px; right: 22px; font-size: 12px; opacity: 0; letter-spacing: .05em; line-height: 1.7; text-align: right; z-index: 6;
    transition: opacity 1.5s; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
  #counter { position: fixed; top: 18px; left: 22px; font-size: 13px; opacity: 0; z-index: 6; transition: opacity 1.5s; letter-spacing: .08em; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
  #counter b { font-size: 20px; color: #ffb3ea; }
  @media (max-width: 640px) { #hud { flex-wrap: wrap; justify-content: center; width: 92vw; border-radius: 20px; } #hud input[type=range]{ width: 80px; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="loader">
  <h1>ISLA DE CRISTAL</h1>
  <div id="bar"><div></div></div>
  <button id="enter">ENTRAR ✦</button>
</div>
<div id="title"><h2>ISLA DE CRISTAL</h2><p>un mundo flotante hecho con código</p></div>
<div id="counter">Cristales despertados: <b id="count">0</b> / <span id="total">0</span></div>
<div id="hint">Arrastra para girar · Rueda para zoom<br>Toca los cristales y las setas ✦</div>
<div id="hud">
  <button id="bTime">🌙 Noche</button>
  <button id="bRotate" class="on">⟳ Auto-giro</button>
  <button id="bSound" class="on">♪ Sonido</button>
  <button id="bMagic">✦ Lluvia mágica</button>
  <label for="glow">Brillo</label><input id="glow" type="range" min="0" max="2.5" step="0.05" value="0.75">
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------- core ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const fogColor = new THREE.Color(0xd9927f);
scene.fog = new THREE.FogExp2(fogColor, 0.0075);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 1500);
camera.position.set(-10, 4.2, 15.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, -0.3, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 6;
controls.maxDistance = 45;
controls.maxPolarAngle = Math.PI * 0.62;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.45;

// ---------- shared GLSL noise ----------
const NOISE = /* glsl */`
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}`;

// ---------- day / night palettes ----------
const PAL = {
  dusk:  { top: new THREE.Color(0x2a0f52), mid: new THREE.Color(0xb8467a), hor: new THREE.Color(0xffa060), low: new THREE.Color(0x3a1440),
           fog: new THREE.Color(0xc77a7a), sun: 3.2, sunCol: new THREE.Color(0xffb27a), hemi: 0.9, stars: 0.0, exposure: 1.0,
           cloudLit: new THREE.Color(0xe8a3a8), cloudShadow: new THREE.Color(0x5a2f68) },
  night: { top: new THREE.Color(0x02030c), mid: new THREE.Color(0x0b0f33), hor: new THREE.Color(0x30245e), low: new THREE.Color(0x05030c),
           fog: new THREE.Color(0x1c1840), sun: 0.6, sunCol: new THREE.Color(0x8aa6ff), hemi: 0.35, stars: 1.0, exposure: 1.05,
           cloudLit: new THREE.Color(0x6a73b8), cloudShadow: new THREE.Color(0x14123a) },
};
let mode = new URLSearchParams(location.search).has('night') ? 1 : 0;           // 0 = dusk, 1 = night (animated value)
let modeTarget = new URLSearchParams(location.search).has('night') ? 1 : 0;

// ---------- sky dome ----------
const skyU = {
  top: { value: PAL.dusk.top.clone() }, mid: { value: PAL.dusk.mid.clone() }, hor: { value: PAL.dusk.hor.clone() },
  low: { value: PAL.dusk.low.clone() }, stars: { value: 0 }, time: { value: 0 },
};
const sky = new THREE.Mesh(new THREE.SphereGeometry(800, 48, 24), new THREE.ShaderMaterial({
  uniforms: skyU, side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    uniform vec3 top, mid, hor, low; uniform float stars, time; varying vec3 vDir;
    float hash(vec3 p){ p = fract(p*0.3183099+0.1); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
    void main(){
      float y = vDir.y;
      vec3 c = mix(hor, mid, smoothstep(0.0, 0.18, y));
      c = mix(c, top, smoothstep(0.15, 0.7, y));
      c = mix(c, low, smoothstep(0.0, -0.25, y));
      // sun glow
      vec3 sunDir = normalize(vec3(-0.95, 0.1, -0.1));
      float s = max(dot(vDir, sunDir), 0.0);
      c += vec3(1.0,0.55,0.3) * (pow(s, 12.0)*0.6 + pow(s, 400.0)*2.0) * (1.0 - stars);
      // stars
      vec3 g = floor(vDir * 260.0);
      float h = hash(g);
      float st = step(0.9965, h) * smoothstep(0.02, 0.35, y);
      float tw = 0.6 + 0.4*sin(time*2.0 + h*80.0);
      c += vec3(1.0,0.95,0.9) * st * tw * (0.25 + stars*2.2);
      gl_FragColor = vec4(c, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
}));
scene.add(sky);

// ---------- lights ----------
const hemi = new THREE.HemisphereLight(0xffc0d8, 0x40204a, PAL.dusk.hemi);
scene.add(hemi);
const sun = new THREE.DirectionalLight(PAL.dusk.sunCol, PAL.dusk.sun);
sun.position.set(-20, 7, -2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 60 });
sun.shadow.bias = -0.0005;
scene.add(sun);
const rim = new THREE.DirectionalLight(0x7a8cff, 0.7);
rim.position.set(15, 6, 12);
scene.add(rim);
const crystalLight = new THREE.PointLight(0x66ddff, 40, 12, 1.6);
crystalLight.position.set(0, 2.6, 0);
const magentaLight = new THREE.PointLight(0xff3fbf, 18, 9, 1.6);
magentaLight.position.set(1.5, 2.0, 1.5);

// ---------- cloud sea (animated in shader) ----------
const cloudU = {
  time: { value: 0 }, lit: { value: PAL.dusk.cloudLit.clone() }, shadow: { value: PAL.dusk.cloudShadow.clone() },
  fogC: { value: fogColor.clone() }, fogD: { value: 0.0075 }, sunDir: { value: sun.position.clone().normalize() },
};
const cloudGeo = new THREE.PlaneGeometry(420, 420, 220, 220);
cloudGeo.rotateX(-Math.PI / 2);
const clouds = new THREE.Mesh(cloudGeo, new THREE.ShaderMaterial({
  uniforms: cloudU, fog: false,
  vertexShader: NOISE + `
    uniform float time; varying vec3 vWorld; varying vec3 vN; varying float vH;
    float hgt(vec2 p){
      vec2 q = p*0.045 + vec2(time*0.012, time*0.006);
      float h = snoise(vec3(q, time*0.01))*0.6 + snoise(vec3(q*2.3, 1.7))*0.28 + snoise(vec3(q*5.1, 3.1))*0.12;
      return pow(max(h*0.5+0.55, 0.0), 1.8) * 9.0;
    }
    void main(){
      vec3 p = position;
      float h = hgt(p.xz); p.y += h; vH = h/9.0;
      float e = 0.6;
      vec3 dx = vec3(e, hgt(p.xz+vec2(e,0.0))-h, 0.0);
      vec3 dz = vec3(0.0, hgt(p.xz+vec2(0.0,e))-h, e);
      vN = normalize(cross(dz, dx));
      vec4 w = modelMatrix*vec4(p,1.0); vWorld = w.xyz;
      gl_Position = projectionMatrix*viewMatrix*w;
    }`,
  fragmentShader: `
    uniform vec3 lit, shadow, fogC, sunDir; uniform float fogD; varying vec3 vWorld; varying vec3 vN; varying float vH;
    void main(){
      float d = max(dot(normalize(vN), normalize(sunDir)), 0.0);
      vec3 c = mix(shadow, lit, clamp(d*0.85 + vH*0.45, 0.0, 1.0));
      c *= 0.85 + 0.3*smoothstep(0.2, 0.9, vH);
      // soft silver lining
      vec3 V = normalize(cameraPosition - vWorld);
      c += lit * pow(1.0 - max(dot(V, normalize(vN)), 0.0), 3.0) * 0.25;
      float dist = length(cameraPosition - vWorld);
      float f = 1.0 - exp(-pow(dist*fogD, 2.0));
      gl_FragColor = vec4(mix(c, fogC, f), 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
}));
clouds.position.y = -17;
scene.add(clouds);

// ---------- fireflies ----------
const FF = 260;
const ffGeo = new THREE.BufferGeometry();
const ffPos = new Float32Array(FF * 3), ffSeed = new Float32Array(FF);
for (let i = 0; i < FF; i++) {
  const a = Math.random() * Math.PI * 2, r = 0.8 + Math.random() * 7.5;
  ffPos.set([Math.cos(a) * r, 0.4 + Math.random() * 4.5, Math.sin(a) * r], i * 3);
  ffSeed[i] = Math.random() * 100;
}
ffGeo.setAttribute('position', new THREE.BufferAttribute(ffPos, 3));
ffGeo.setAttribute('seed', new THREE.BufferAttribute(ffSeed, 1));
const ffU = { time: { value: 0 }, size: { value: 34 * renderer.getPixelRatio() }, boost: { value: 1 } };
const fireflies = new THREE.Points(ffGeo, new THREE.ShaderMaterial({
  uniforms: ffU, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float time, size; attribute float seed; varying float vA; varying float vS;
    void main(){
      vec3 p = position;
      p.x += sin(time*0.35 + seed)*0.6; p.z += cos(time*0.3 + seed*1.3)*0.6; p.y += sin(time*0.5 + seed*2.1)*0.45;
      vec4 mv = modelViewMatrix*vec4(p,1.0);
      vA = 0.5 + 0.5*sin(time*2.2 + seed*7.0); vS = seed;
      gl_PointSize = size * (0.6 + vA*0.6) / -mv.z;
      gl_Position = projectionMatrix*mv;
    }`,
  fragmentShader: `
    uniform float boost; varying float vA; varying float vS;
    void main(){
      float d = length(gl_PointCoord - 0.5);
      float a = smoothstep(0.5, 0.0, d); a = a*a;
      vec3 c = mix(vec3(1.0,0.85,0.45), vec3(0.6,1.0,0.9), step(0.75, fract(vS)));
      gl_FragColor = vec4(c*(1.5+boost*1.5), a*(0.35+vA*0.65));
    }`,
}));

// ---------- burst particles (on click) ----------
const BURST = 1400;
const bGeo = new THREE.BufferGeometry();
const bPos = new Float32Array(BURST * 3), bVel = new Float32Array(BURST * 3), bLife = new Float32Array(BURST), bCol = new Float32Array(BURST * 3);
bLife.fill(0);
bGeo.setAttribute('position', new THREE.BufferAttribute(bPos, 3));
bGeo.setAttribute('life', new THREE.BufferAttribute(bLife, 1));
bGeo.setAttribute('color', new THREE.BufferAttribute(bCol, 3));
const bursts = new THREE.Points(bGeo, new THREE.ShaderMaterial({
  uniforms: { size: { value: 26 * renderer.getPixelRatio() } },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, vertexColors: true,
  vertexShader: `uniform float size; attribute float life; varying float vL; varying vec3 vC;
    void main(){ vL = life; vC = color; vec4 mv = modelViewMatrix*vec4(position,1.0);
      gl_PointSize = size*life/-mv.z; gl_Position = projectionMatrix*mv; }`,
  fragmentShader: `varying float vL; varying vec3 vC;
    void main(){ float d = length(gl_PointCoord-0.5); float a = smoothstep(0.5,0.0,d);
      if (vL <= 0.0) discard; gl_FragColor = vec4(vC*3.0, a*vL); }`,
}));
bursts.frustumCulled = false;
scene.add(bursts);
let bHead = 0;
function burst(origin, color, n = 160, speed = 3.2, up = 1.5) {
  for (let k = 0; k < n; k++) {
    const i = bHead; bHead = (bHead + 1) % BURST;
    bPos.set([origin.x, origin.y, origin.z], i * 3);
    const v = new THREE.Vector3().randomDirection().multiplyScalar(speed * (0.3 + Math.random()));
    v.y += up * Math.random();
    bVel.set([v.x, v.y, v.z], i * 3);
    bLife[i] = 1;
    const c = color.clone().offsetHSL((Math.random() - 0.5) * 0.08, 0, Math.random() * 0.2);
    bCol.set([c.r, c.g, c.b], i * 3);
  }
}

// ---------- materials for named pieces ----------
const waterU = { time: { value: 0 } };
const waterMat = new THREE.ShaderMaterial({
  uniforms: waterU, transparent: true, depthWrite: false, side: THREE.DoubleSide,
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: NOISE + `
    uniform float time; varying vec2 vUv;
    void main(){
      float n = snoise(vec3(vUv.x*7.0, vUv.y*10.0 + time*1.6, time*0.2))*0.5+0.5;
      float n2 = snoise(vec3(vUv.x*18.0, vUv.y*26.0 + time*2.6, 4.0))*0.5+0.5;
      float streak = smoothstep(0.35, 0.85, n*0.7 + n2*0.4);
      vec3 c = mix(vec3(0.25,0.6,1.0), vec3(0.95,0.99,1.0), streak);
      float edge = 1.0 - pow(abs(vUv.x-0.5)*2.0, 2.0);
      float a = edge * smoothstep(0.0, 0.35, vUv.y) * (0.45 + streak*0.55);
      gl_FragColor = vec4(c*1.25, a);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
});

const crystalDefs = {
  CristalCian:    { color: 0x2fd6ff, note: 0 },
  CristalMagenta: { color: 0xff3fae, note: 2 },
  CristalVioleta: { color: 0x9a5cff, note: 4 },
};
const crystals = [];      // { mesh, mat, base, pulse, awake }
const mushrooms = [];     // { mesh, base, bounce }
const runeRings = [];
const floatRocks = [];
let island = null, centralCrystal = null;
let runeMat = null, mushroomMat = null;

// ---------- load ----------
const bar = document.querySelector('#bar div');
const loader = new GLTFLoader();
loader.load('isla.glb', (gltf) => {
  const root = gltf.scene;
  root.traverse((o) => {
    if (!o.isMesh) return;
    const mname = o.material?.name || '';
    o.castShadow = true; o.receiveShadow = true;

    if (crystalDefs[mname]) {
      const def = crystalDefs[mname];
      const mat = new THREE.MeshPhysicalMaterial({
        color: def.color, emissive: def.color, emissiveIntensity: 1.4, roughness: 0.08, metalness: 0.0,
        clearcoat: 1, clearcoatRoughness: 0.05, transparent: true, opacity: 0.92, flatShading: true,
      });
      o.material = mat; o.castShadow = false;
      crystals.push({ mesh: o, mat, s0: o.scale.clone(), base: 1.4, pulse: 0, awake: false, color: new THREE.Color(def.color), note: def.note });
      if (o.name.startsWith('CristalCentral')) centralCrystal = o;
    } else if (mname === 'Agua') {
      o.material = waterMat; o.castShadow = false; o.receiveShadow = false;
    } else if (mname === 'Runas') {
      runeMat = runeMat || new THREE.MeshBasicMaterial({ color: new THREE.Color(1.0, 0.7, 0.3).multiplyScalar(3.0), toneMapped: false });
      o.material = runeMat; o.castShadow = false;
      runeRings.push(o);
    } else if (mname === 'SetaSombrero') {
      mushroomMat = mushroomMat || new THREE.MeshStandardMaterial({ color: 0x29f0d4, emissive: 0x29f0d4, emissiveIntensity: 2.2, roughness: 0.4 });
      o.material = mushroomMat.clone(); o.castShadow = false;
      mushrooms.push({ mesh: o, base: o.scale.clone(), bounce: 0 });
    } else if (mname === 'HierbaMat') {
      o.material = new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: 0.85, color: 0x7fbf6a });
      o.castShadow = false;
    } else if (mname === 'FloresMat') {
      o.material = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.6, emissive: 0xffffff, emissiveIntensity: 0.0 });
      o.material.onBeforeCompile = (s) => {   // let flower colours glow softly
        s.fragmentShader = s.fragmentShader.replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\n totalEmissiveRadiance = vColor.rgb * 0.35;');
      };
      o.castShadow = false;
    } else if (mname === 'IslaMat') {
      o.material = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.92 });
      o.material.color.setScalar(1.25);
    } else if (mname.startsWith('Hojas')) {
      o.material.roughness = 0.65;
    }
    if (o.name.startsWith('RocaFlotante')) floatRocks.push({ obj: o, y: o.position.y, ph: Math.random() * 6.28, sp: 0.4 + Math.random() * 0.5 });
  });
  island = root.getObjectByName('Isla');
  // attach glow lights + fireflies to island so they float together
  island.add(crystalLight, magentaLight);
  island.add(fireflies);
  // lights live in island-local space (Blender Z-up) -> convert
  const toLocal = (v) => island.worldToLocal(v.clone());
  crystalLight.position.copy(toLocal(new THREE.Vector3(0, 2.6, 0)));
  magentaLight.position.copy(toLocal(new THREE.Vector3(1.5, 2.0, 1.5)));
  fireflies.quaternion.copy(island.quaternion).invert();
  fireflies.position.copy(toLocal(new THREE.Vector3(0, 0, 0)));
  island.userData.y = island.position.y;

  scene.add(root);
  document.querySelector('#total').textContent = crystals.length;
  bar.style.width = '100%';
  document.querySelector('#enter').classList.add('ready');
  if (new URLSearchParams(location.search).has('auto')) document.querySelector('#enter').click();
}, (e) => { if (e.total) bar.style.width = (e.loaded / e.total * 100).toFixed(0) + '%'; },
   (err) => { console.error(err); document.querySelector('#loader h1').textContent = 'Error cargando la escena'; });

// ---------- post processing ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.75, 0.5, 0.9);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------- audio (WebAudio synth, no files) ----------
let ac = null, master = null, reverb = null, soundOn = true, pad = null;
function initAudio() {
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  ac.resume();
  master = ac.createGain(); master.gain.value = 0.55; master.connect(ac.destination);
  // generated impulse reverb
  const len = ac.sampleRate * 3.5, ir = ac.createBuffer(2, len, ac.sampleRate);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
  reverb = ac.createConvolver(); reverb.buffer = ir;
  const wet = ac.createGain(); wet.gain.value = 0.7; reverb.connect(wet); wet.connect(master);
  startPad();
}
const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
const hz = (semi, base = 523.25) => base * Math.pow(2, semi / 12);
function chime(idx, vel = 1) {
  if (!ac || !soundOn) return;
  const t = ac.currentTime, f = hz(SCALE[idx % SCALE.length]);
  [1, 2.01, 3.0, 4.2].forEach((m, k) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.value = f * m;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.16 * vel / (k + 1), t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.8 / (k * 0.6 + 1));
    o.connect(g); g.connect(master); g.connect(reverb); o.start(t); o.stop(t + 3);
  });
}
function bloop() {
  if (!ac || !soundOn) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(320, t); o.frequency.exponentialRampToValueAtTime(900, t + 0.12);
  g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
  o.connect(g); g.connect(master); g.connect(reverb); o.start(t); o.stop(t + 0.4);
}
function startPad() {
  pad = ac.createGain(); pad.gain.value = 0; pad.connect(master); pad.connect(reverb);
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900; lp.connect(pad);
  const lfo = ac.createOscillator(), lfoG = ac.createGain(); lfo.frequency.value = 0.07; lfoG.gain.value = 400;
  lfo.connect(lfoG); lfoG.connect(lp.frequency); lfo.start();
  [130.81, 196.0, 246.94, 329.63, 392.0].forEach((f, i) => {
    [-6, 6].forEach((det) => {
      const o = ac.createOscillator(); o.type = i < 2 ? 'triangle' : 'sawtooth'; o.frequency.value = f; o.detune.value = det;
      const g = ac.createGain(); g.gain.value = i < 2 ? 0.05 : 0.018; o.connect(g); g.connect(lp); o.start();
    });
  });
  pad.gain.linearRampToValueAtTime(0.5, ac.currentTime + 6);
}

// ---------- interaction ----------
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hovered = null;
function pick(ev) {
  mouse.set((ev.clientX / innerWidth) * 2 - 1, -(ev.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const targets = [...crystals.map(c => c.mesh), ...mushrooms.map(m => m.mesh)];
  const hit = ray.intersectObjects(targets, false)[0];
  return hit || null;
}
renderer.domElement.addEventListener('pointermove', (ev) => {
  const h = pick(ev);
  hovered = h ? h.object : null;
  renderer.domElement.style.cursor = hovered ? 'pointer' : 'grab';
});
let downAt = null;
renderer.domElement.addEventListener('pointerdown', (ev) => { downAt = [ev.clientX, ev.clientY]; });
renderer.domElement.addEventListener('pointerup', (ev) => {
  if (!downAt || Math.hypot(ev.clientX - downAt[0], ev.clientY - downAt[1]) > 6) return;   // was a drag
  const h = pick(ev); if (!h) return;
  const c = crystals.find(c => c.mesh === h.object);
  if (c) {
    c.pulse = 1;
    burst(h.point, c.color, c.mesh === centralCrystal ? 420 : 170, c.mesh === centralCrystal ? 5 : 3.2);
    chime(c.note + Math.floor(Math.random() * 3) + (c.mesh === centralCrystal ? 0 : 3));
    if (!c.awake) { c.awake = true; updateCount(); }
    if (c.mesh === centralCrystal) { [0, 4, 7].forEach((n, k) => setTimeout(() => chime(n + 5, 0.8), 120 * k)); }
    return;
  }
  const m = mushrooms.find(m => m.mesh === h.object);
  if (m) { m.bounce = 1; bloop(); burst(h.point, new THREE.Color(0x29f0d4), 50, 1.6, 2); }
});
function updateCount() {
  const n = crystals.filter(c => c.awake).length;
  document.querySelector('#count').textContent = n;
  if (n === crystals.length) magicRain(true);
}
function magicRain(finale = false) {
  crystals.forEach((c, i) => setTimeout(() => {
    c.pulse = 1;
    const p = new THREE.Vector3(); c.mesh.getWorldPosition(p); p.y += 1.2;
    burst(p, c.color, finale ? 120 : 60, 3);
    chime(i, 0.6);
  }, i * 90));
  for (let k = 0; k < 6; k++) setTimeout(() => {
    burst(new THREE.Vector3((Math.random() - .5) * 8, 9 + Math.random() * 3, (Math.random() - .5) * 8),
          new THREE.Color().setHSL(Math.random(), 0.9, 0.65), 140, 2.5, -2);
  }, 300 + k * 260);
}

// ---------- HUD ----------
const bTime = document.querySelector('#bTime'), bRot = document.querySelector('#bRotate'), bSnd = document.querySelector('#bSound');
bTime.onclick = () => { modeTarget = modeTarget ? 0 : 1; bTime.textContent = modeTarget ? '☀ Atardecer' : '🌙 Noche'; bTime.classList.toggle('on', !!modeTarget); };
bRot.onclick = () => { controls.autoRotate = !controls.autoRotate; bRot.classList.toggle('on', controls.autoRotate); };
bSnd.onclick = () => {
  soundOn = !soundOn; bSnd.classList.toggle('on', soundOn);
  if (ac) master.gain.linearRampToValueAtTime(soundOn ? 0.55 : 0, ac.currentTime + 0.4);
};
document.querySelector('#bMagic').onclick = () => magicRain();
document.querySelector('#glow').oninput = (e) => { bloom.strength = +e.target.value; };

document.querySelector('#enter').onclick = () => {
  initAudio();
  const L = document.querySelector('#loader'); L.style.opacity = 0; setTimeout(() => L.remove(), 1300);
  if (intro < 0) intro = 0;
  ['#title', '#hud', '#hint', '#counter'].forEach((s, i) => setTimeout(() => document.querySelector(s).style.opacity = 1, 600 + i * 400));
  setTimeout(() => document.querySelector('#title').style.opacity = 0, 7000);
};

// ---------- animate ----------
const clock = new THREE.Clock();
let intro = new URLSearchParams(location.search).has('still') ? 1 : -1;  // camera fly-in
const camStart = new THREE.Vector3(-30, 14, 46), camEnd = new THREE.Vector3(-10, 4.2, 15.5);
camera.position.copy(intro === 1 ? camEnd : camStart);
const lerpCol = (out, a, b, t) => out.copy(a).lerp(b, t);

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;

  if (intro >= 0 && intro < 1) {
    intro = Math.min(1, intro + dt / 4.5);
    const e = 1 - Math.pow(1 - intro, 3);
    camera.position.lerpVectors(camStart, camEnd, e);
  }
  controls.update();

  // day/night blend
  mode += (modeTarget - mode) * Math.min(1, dt * 1.2);
  const A = PAL.dusk, B = PAL.night;
  lerpCol(skyU.top.value, A.top, B.top, mode); lerpCol(skyU.mid.value, A.mid, B.mid, mode);
  lerpCol(skyU.hor.value, A.hor, B.hor, mode); lerpCol(skyU.low.value, A.low, B.low, mode);
  skyU.stars.value = mode; skyU.time.value = t;
  lerpCol(scene.fog.color, A.fog, B.fog, mode); cloudU.fogC.value.copy(scene.fog.color);
  lerpCol(cloudU.lit.value, A.cloudLit, B.cloudLit, mode); lerpCol(cloudU.shadow.value, A.cloudShadow, B.cloudShadow, mode);
  sun.intensity = THREE.MathUtils.lerp(A.sun, B.sun, mode); lerpCol(sun.color, A.sunCol, B.sunCol, mode);
  hemi.intensity = THREE.MathUtils.lerp(A.hemi, B.hemi, mode);
  ffU.boost.value = mode;
  crystalLight.intensity = 40 + mode * 20;

  cloudU.time.value = t; waterU.time.value = t; ffU.time.value = t;

  if (island) {
    island.position.y = island.userData.y + Math.sin(t * 0.45) * 0.25;
    island.rotation.z = Math.sin(t * 0.3) * 0.012;
    if (centralCrystal) centralCrystal.rotateY(dt * 0.25);
    runeRings.forEach((r, i) => r.rotateY(dt * (i % 2 ? -0.35 : 0.5)));
    if (runeMat) runeMat.color.setRGB(1.0, 0.7, 0.3).multiplyScalar(2.2 + Math.sin(t * 1.7) * 0.8 + mode * 1.5);
    floatRocks.forEach((r) => { r.obj.position.y = r.y + Math.sin(t * r.sp + r.ph) * 0.45; r.obj.rotation.y += dt * 0.05 * r.sp; });

    crystals.forEach((c, i) => {
      c.pulse = Math.max(0, c.pulse - dt * 1.3);
      const breathe = Math.sin(t * 1.3 + i) * 0.25;
      const hov = c.mesh === hovered ? 1.2 : 0;
      const awake = c.awake ? 0.6 : 0;
      c.mat.emissiveIntensity = c.base + breathe + hov + awake + c.pulse * 6 + mode * 0.1;
      c.mesh.scale.copy(c.s0).multiplyScalar(1 + c.pulse * 0.08);
    });
    mushrooms.forEach((m, i) => {
      m.bounce = Math.max(0, m.bounce - dt * 2.2);
      const k = 1 + Math.sin(m.bounce * Math.PI * 3) * m.bounce * 0.5;
      m.mesh.scale.set(m.base.x * (2 - k), m.base.y * k, m.base.z * (2 - k));
      m.mesh.material.emissiveIntensity = 1.6 + Math.sin(t * 2 + i * 1.7) * 0.6 + m.bounce * 5 + mode * 1.2 + (m.mesh === hovered ? 1.5 : 0);
    });
  }

  // burst physics
  let alive = false;
  for (let i = 0; i < BURST; i++) {
    if (bLife[i] <= 0) continue; alive = true;
    bVel[i * 3 + 1] -= 2.2 * dt;
    bVel[i * 3] *= 0.985; bVel[i * 3 + 2] *= 0.985;
    bPos[i * 3] += bVel[i * 3] * dt; bPos[i * 3 + 1] += bVel[i * 3 + 1] * dt; bPos[i * 3 + 2] += bVel[i * 3 + 2] * dt;
    bLife[i] -= dt * 0.55;
  }
  if (alive) { bGeo.attributes.position.needsUpdate = true; bGeo.attributes.life.needsUpdate = true; bGeo.attributes.color.needsUpdate = true; }

  composer.render();
  requestAnimationFrame(tick);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
